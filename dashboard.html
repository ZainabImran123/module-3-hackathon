<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unified Dashboard | Space Cyan</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <!-- SweetAlert2 Dark Theme CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" />
    <!-- Custom Cyber Theme CSS -->
    <link rel="stylesheet" href="dashboard.css" />
</head>

<body>

    <div class="bg-glow glow-cyan-1"></div>
    <div class="bg-glow glow-cyan-2"></div>

    <div class="container py-4 position-relative z-1 animate-wrapper" style="max-width: 1200px;">

        <!-- Top Navigation Bar -->
        <div class="d-flex justify-content-between align-items-center mb-4 p-3 cyber-card rounded-4">
            <div class="d-flex align-items-center gap-3">
                <div class="brand-badge d-inline-flex align-items-center justify-content-center m-0"
                    style="width: 40px; height: 40px;">
                    <i class="bi bi-speedometer2 text-primary-accent"></i>
                </div>
                <div>
                    <h5 class="text-white mb-0 fw-bold fs-6">Service Portal Dashboard</h5>
                    <span id="user-email-display" class="text-muted-custom small">Loading session...</span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="problem-statement.html" class="btn btn-outline-info btn-sm px-3 rounded-pill fw-semibold">
                    <i class="bi bi-search me-1"></i> Browse Directory
                </a>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm px-3 rounded-pill fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                </button>
            </div>
        </div>

        <!-- Role Selector Tab Header -->
        <div class="cyber-card p-3 rounded-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="fw-bold tracking-tight text-white fs-4 mb-1">Activity Control Panel</h2>
                <p class="text-muted-custom small mb-0">Switch views to manage bookings as a Customer or Service
                    Provider.</p>
            </div>
            <div class="btn-group" role="group">
                <button type="button" id="btn-tab-customer"
                    class="btn btn-cyber-primary text-black fw-bold px-4 py-2 rounded-start-pill">
                    <i class="bi bi-person-fill me-1"></i> Customer View
                </button>
                <button type="button" id="btn-tab-provider"
                    class="btn btn-outline-info fw-bold px-4 py-2 rounded-end-pill">
                    <i class="bi bi-tools me-1"></i> Provider Hub
                </button>
            </div>
        </div>

        <!-- Dynamic Container Grid -->
        <div class="row g-4" id="dashboard-grid">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-info" role="status"></div>
                <p class="text-muted-custom mt-2 small">Loading dashboard data...</p>
            </div>
        </div>

    </div>

    <!-- Review Modal for Customers -->
    <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content cyber-card p-4 border border-secondary">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title text-white fw-bold">Leave Service Review</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body pt-3">
                    <form id="review-form">
                        <input type="hidden" id="review-booking-id" />

                        <div class="mb-3">
                            <label class="form-label small text-muted-custom mb-1">Rating (1 to 5 Stars)</label>
                            <select id="review-rating" class="form-control-cyber text-white">
                                <option value="5">⭐⭐⭐⭐⭐ (5 - Excellent)</option>
                                <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                                <option value="3">⭐⭐⭐ (3 - Average)</option>
                                <option value="2">⭐⭐ (2 - Poor)</option>
                                <option value="1">⭐ (1 - Terrible)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small text-muted-custom mb-1">Feedback Comments</label>
                            <textarea id="review-comment" class="form-control-cyber" rows="3"
                                placeholder="Share details about the completed service..." required></textarea>
                        </div>

                        <button type="submit"
                            class="btn btn-cyber-primary w-100 py-2.5 rounded-3 fw-bold text-black border-0">
                            Submit Review
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Dashboard Logic Script -->
    <script src="dashboard.js"></script>
</body>

</html>
